services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-code-editor
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3001
      - NODE_ENV=production
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - LOCAL_OLLAMA_URL=http://ollama:11434
    volumes:
      - uploads_data:/app/src/public/uploads
    depends_on:
      ollama:
        condition: service_started
    networks:
      - editor-net

  ollama:
    image: ollama/ollama:latest
    container_name: personal-code-editor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - editor-net
    # To enable GPU acceleration on NVIDIA GPUs, uncomment the block below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  uploads_data:
    name: editor_uploads_data
  ollama_data:
    name: editor_ollama_data

networks:
  editor-net:
    driver: bridge
