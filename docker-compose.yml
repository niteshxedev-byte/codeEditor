services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-code-editor
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/src/public/uploads
    networks:
      - editor-net

volumes:
  uploads_data:
    name: editor_uploads_data

networks:
  editor-net:
    driver: bridge
